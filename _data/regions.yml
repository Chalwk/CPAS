# -----------------------------------------------------------------------------
# Region boundaries for guide maps.
#
# Each region defines a closed polygon (first point = last point) tracing an
# operational area. Guides reference a region by key via front matter:
#
#     region: banks_peninsula
#
# Optional front-matter overrides (per guide):
#     region_title:    "Custom title"
#     region_center:   [lat, lon]
#     region_zoom:     10
#     region_boundary: [[lat, lon], ...]   # inline, bypasses _data/regions.yml
# -----------------------------------------------------------------------------

